name: Build macOS app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check build script
        run: bash -n build.sh
      - name: Build and verify universal app
        run: bash build.sh --universal
